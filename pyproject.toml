[project]
name = "facegroup"
version = "0.1.0"
description = "Local-first face grouping and search for your own photo library"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",  # includes the CPU provider too
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "psutil>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "tokenizers>=0.20",
    "rapidocr>=3.10",
]

[project.scripts]
facegroup = "facegroup.entrypoints.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facegroup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real model files (downloaded on first use)",
]
addopts = "-m 'not integration'"
